name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect the web app
        run: |
          mkdir -p build/www
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android-build' --exclude 'build' --exclude 'README.md' --exclude '.nojekyll' ./ build/www/
          test -f build/www/index.html
          VERSION=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Knowvia $VERSION"

      - name: Create the Android project
        working-directory: build
        run: |
          cp ../android-build/capacitor.config.json .
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Add icons, signing key and version
        working-directory: build
        run: |
          cp -r ../android-build/res/. android/app/src/main/res/
          cp ../android-build/knowvia-test.jks android/app/knowvia-test.jks
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#EFF2FF</color>
          </resources>
          XML
          python3 ../android-build/patch_gradle.py android/app/build.gradle "${GITHUB_RUN_NUMBER}" "${VERSION}"

      - name: Build the APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: |
          cp build/android/app/build/outputs/apk/debug/app-debug.apk Knowvia.apk
          ls -la Knowvia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Knowvia-android
          path: Knowvia.apk

      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest Knowvia.apk \
            --title "Knowvia Android app ${VERSION}" \
            --notes "Latest Android test build (version ${VERSION}). Download Knowvia.apk, open it, and allow installing from this source if Android asks. Install it over the old one to keep your progress." \
            --target "${GITHUB_SHA}"
